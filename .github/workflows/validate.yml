name: Cross-platform validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run unit tests
        run: bun test

      - name: Run all language integration tests
        env:
          REPOGRAPH_INTEGRATION: "1"
          REPOGRAPH_LANGUAGE_REPORT: .repograph/language-coverage.json
        run: bun test test/integration.test.ts test/languages.integration.test.ts

      - name: Verify installed npm package and Node CLI
        run: npm run test:package

      - name: Upload language coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: language-coverage-${{ matrix.os }}-node-${{ matrix.node }}
          path: .repograph/language-coverage.json
          if-no-files-found: warn
          include-hidden-files: true
